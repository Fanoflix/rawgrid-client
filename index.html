<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/rawgrid-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rawgrid</title>
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem("theme");
          if (stored !== "light") document.documentElement.classList.add("dark");
        } catch (error) {
          document.documentElement.classList.add("dark");
        }
        try {
          var level = Number(window.localStorage.getItem("font-scale"));
          if (Number.isInteger(level) && level !== 0) {
            level = Math.min(5, Math.max(-1, level));
            document.documentElement.style.setProperty("--font-scale", String(1 + level / 10));
          }
        } catch (error) {}
        try {
          var css = window.localStorage.getItem("custom-theme-css");
          if (css) {
            var style = document.createElement("style");
            style.id = "custom-theme";
            style.textContent = css;
            document.head.appendChild(style);
          }
        } catch (error) {}
      })();
    </script>
    <!-- GitHub Pages SPA redirect handler (works with public/404.html) -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').filter(function(s) {
            return !/^r=\d+$/.test(s)
          }).map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.replace(/\/$/, '') + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
